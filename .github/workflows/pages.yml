name: Publish Snapshot LP
on:
  push:
    branches: [main]
    paths: ['snapshot-lp-site.zip', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract approved site
        run: |
          mkdir -p _site
          unzip -q snapshot-lp-site.zip -d _site
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
